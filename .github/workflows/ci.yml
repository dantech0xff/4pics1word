name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i iphone | head -10

      - name: Build
        run: >-
          xcodebuild
          -project 4pics1word.xcodeproj
          -scheme 4pics1word
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17'
          build

      - name: Test
        run: >-
          xcodebuild
          -project 4pics1word.xcodeproj
          -scheme 4pics1word
          -destination 'platform=iOS Simulator,OS=latest,name=iPhone 17'
          -parallel-testing-enabled NO
          -skip-testing:4pics1wordUITests/_pics1wordUITests
          -skip-testing:4pics1wordUITests/_pics1wordUITestsLaunchTests
          test
